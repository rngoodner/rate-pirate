<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe6f7" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS touch icon: must be a real PNG. Versioned filename because iOS
         caches touch icons (including failed lookups) per-URL and ignores
         query strings; bump the name if the artwork ever changes. Copies also
         exist at /apple-touch-icon(-precomposed).png — the default paths iOS
         probes when it distrusts the link tag. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/touch-icon-180-v2.png" />
    <title>Rate Pirate</title>
  </head>

    <div id="root"></div>

  </body>
