# nginx server block for Rate Pirate — install on your-server.local:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rate-pirate
#   sudo ln -s /etc/nginx/sites-available/rate-pirate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Port 8081 (80/8080/32400 are taken by other apps on this host).
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
